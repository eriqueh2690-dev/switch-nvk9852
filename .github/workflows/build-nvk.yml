Se a compilação chegar aos 100% com sucesso, você vai ver algo entre 40 a 100 arquivos .a nessa pasta (o Mesa é um projeto gigantesco e gera muitos pedacinhos).

E o principal deles é que, obrigatoriamente, um desses arquivos vai se chamar libvulkan_nouveau.a (que é o driver do Switch propriamente dito, onde ficam as funções que estão dando erro no seu Makefile).

Como ele parou em 11 arquivos, ele provavelmente não chegou nem em 15% do processo. Vá lá nos logs do GitHub Actions, desça até o final da tela preta na Fase 2 e me mande o erro que está escrito logo depois de FAILED:. Sem esse erro, a gente está atirando no escuro! Manda ele aqui que a gente resolve.

