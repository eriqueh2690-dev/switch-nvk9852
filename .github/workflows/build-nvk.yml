name: Build NVK for Switch
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout switch-nvk repo
      uses: actions/checkout@v3
      
    - name: Download and extract Mesa 25.0.7
      run: |
        curl -L -O https://archive.mesa3d.org/mesa-25.0.7.tar.xz
        tar xf mesa-25.0.7.tar.xz
        mv mesa-25.0.7 mesa-25
        
    - name: Fix Execute Permissions and Line Endings
      run: |
        find . -name "*.sh" -exec sed -i 's/\r$//' {} +
        find . -name "*.sh" -exec chmod +x {} \;
        
    - name: Build Docker Image
      run: |
        docker build -t switch-nvk-build .
        
    - name: Build Native Tools (Unpatched)
      run: |
        docker run --rm -v "${{ github.workspace }}:/work" -w /work/mesa-25 switch-nvk-build bash -lc '
          export NATIVE_PREFIX=/work/native-prefix
          export PATH=/work/native-prefix/bin:$PATH
          export BUILD=/work/mb
          bash /work/build-native-tools.sh
        '
        
    - name: Apply Switch Patches
      run: |
        docker run --rm -v "${{ github.workspace }}:/work" -w /work switch-nvk-build bash /work/apply-patches.sh
        docker run --rm -v "${{ github.workspace }}:/work" -w /work switch-nvk-build bash /work/winsys/wsi/apply-wsi-switch.sh
        
    - name: Build Sysroot and Cross-Compile Mesa
      run: |
        docker run --rm -v "${{ github.workspace }}:/work" -w /work/mesa-25 switch-nvk-build bash -elc '
          export NATIVE_PREFIX=/work/native-prefix
          export PATH=/work/native-prefix/bin:$PATH
          export BUILD=/work/mb
          
          echo "=== INSTALANDO RUST NIGHTLY ==="
          rustup default nightly-2026-09-14
          rustup component add rust-src
          
          echo "=== CONFIGURANDO TARGET JSON ==="
          cat << EOF > /work/aarch64-switch-horizon.json
        {
            "arch": "aarch64",
            "cpu": "cortex-a57",
            "data-layout": "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32",
            "dynamic-linking": false,
            "env": "newlib",
            "executables": true,
            "features": "+neon,+fp-armv8,+crc,+crypto",
            "linker": "aarch64-none-elf-gcc",
            "linker-flavor": "gcc",
            "llvm-target": "aarch64-unknown-none",
            "max-atomic-width": 128,
            "os": "none",
            "panic-strategy": "abort",
            "relocation-model": "pic",
            "target-pointer-width": 64,
            "target-c-int-width": 32
        }
        EOF
          export RUST_TARGET_PATH=/work
          export RUSTFLAGS="-Z unstable-options"
          
          echo "=== CONSTRUINDO STD FALSO MELHORADO ==="
          cd /work
          rm -rf fake_std
          cargo new --lib fake_std
          cat << EOF > fake_std/Cargo.toml
        [package]
        name = "std"
        version = "0.1.0"
        edition = "2021"
        [dependencies]
        hashbrown = { version = "0.14", default-features = false, features = ["alloc"] }
        EOF
          cat << EOF > fake_std/src/lib.rs
        #![no_std]
        extern crate alloc;
        pub use core::*;
        pub mod collections {
            pub use alloc::collections::*;
            pub use hashbrown::HashMap;
            pub use hashbrown::HashSet;
        }
        pub mod string { pub use alloc::string::*; }
        pub mod vec { pub use alloc::vec::*; }
        pub mod boxed { pub use alloc::boxed::*; }
        pub mod sync { pub use alloc::sync::*; pub use core::sync::*; }
        pub mod rc { pub use alloc::rc::*; }
        pub mod os {
            pub mod raw {
                pub use core::ffi::*;
            }
        }
        pub mod ffi {
            pub use core::ffi::*;
        }
        pub mod fmt {
            pub use core::fmt::*;
        }
        pub mod prelude {
            pub mod rust_2021 {
                pub use core::prelude::rust_2021::*;
                pub use alloc::string::{String, ToString};
                pub use alloc::vec::Vec;
                pub use alloc::boxed::Box;
                pub use alloc::vec;
                pub use alloc::format;
            }
            pub mod v1 {
                pub use core::prelude::v1::*;
                pub use alloc::string::{String, ToString};
                pub use alloc::vec::Vec;
                pub use alloc::boxed::Box;
                pub use alloc::vec;
                pub use alloc::format;
            }
        }
        EOF
          
          cd fake_std
          cargo build --target aarch64-switch-horizon -Z build-std=core,alloc,compiler_builtins --release
          
          echo "=== MONTANDO SYSROOT DO SWITCH ==="
          mkdir -p /work/sysroot/lib/rustlib/aarch64-switch-horizon/lib/
          
          # Copia todas as bibliotecas base e dependências (como o hashbrown) para o sysroot
          find /work/fake_std/target/aarch64-switch-horizon/release/deps -name "*.rlib" ! -name "libstd-*.rlib" -exec cp -f {} /work/sysroot/lib/rustlib/aarch64-switch-horizon/lib/ \;
          # Copia e renomeia o nosso std falso perfeitinho
          find /work/fake_std/target/aarch64-switch-horizon/release/deps -name "libstd-*.rlib" -exec cp -f {} /work/sysroot/lib/rustlib/aarch64-switch-horizon/lib/libstd.rlib \;
          
          RUSTLIB_DIR=$(rustc --print sysroot)/lib/rustlib
          mkdir -p $RUSTLIB_DIR/aarch64-switch-horizon/lib
          cp -f /work/sysroot/lib/rustlib/aarch64-switch-horizon/lib/*.rlib $RUSTLIB_DIR/aarch64-switch-horizon/lib/ 2>/dev/null || true
          cp -f /work/sysroot/lib/rustlib/aarch64-switch-horizon/lib/*.rmeta $RUSTLIB_DIR/aarch64-switch-horizon/lib/ 2>/dev/null || true
          
          echo "=== REESCREVENDO RUSTC WRAPPER ==="
          cat << EOF > /work/rustc-switch.sh
        #!/bin/bash
        export RUST_TARGET_PATH=/work
        if [[ "\$*" == *"sanity_check"* ]]; then
          touch sanity_check_for_rust_cross.exe
          touch sanity_check_for_rust.exe
          echo "note: native-static-libs: " >&2
          exit 0
        fi
        
        RUSTC_BIN=\$(which rustc)
        exec "\$RUSTC_BIN" -Z unstable-options --target aarch64-switch-horizon --sysroot /work/sysroot "\$@"
        EOF
          chmod +x /work/rustc-switch.sh
          
          echo "=== CRIANDO LIBDL FALSO PARA O SWITCH ==="
          mkdir -p /opt/devkitpro/portlibs/switch/lib
          echo "void* dlopen(const char* filename, int flags) { return 0; }" > /tmp/dummy_dl.c
          echo "void* dlsym(void* handle, const char* symbol) { return 0; }" >> /tmp/dummy_dl.c
          echo "int dlclose(void* handle) { return -1; }" >> /tmp/dummy_dl.c
          echo "char* dlerror(void) { return \"No DL\"; }" >> /tmp/dummy_dl.c
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc -c /tmp/dummy_dl.c -o /tmp/dummy_dl.o
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs /opt/devkitpro/portlibs/switch/lib/libdl.a /tmp/dummy_dl.o
          echo "=== CONFIGURANDO O MESA ==="
          cd /work/mesa-25
          bash /work/configure-mesa.sh || { echo "=== ERRO NO MESON ==="; cat /work/mb/meson-logs/meson-log.txt; exit 1; }
          
          echo "=== COMPILANDO O MESA ==="
          ninja -C /work/mb
          
          echo "=== CONVERTENDO ARQUIVOS THIN PARA THICK ==="
          mkdir -p /work/output_libs
          cd /work/mb
          find . -name "*.a" | while read -r a; do
            ARCHIVE_NAME=$(basename "$a")
            echo "Processando $ARCHIVE_NAME..."
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar -t "$a" | tr "\n" " " > /tmp/objects.txt
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs "/work/output_libs/$ARCHIVE_NAME" @/tmp/objects.txt || echo "Falhou em $ARCHIVE_NAME"
          done
        '
        
    - name: Upload NVK Static Libraries
      uses: actions/upload-artifact@v4
      with:
        name: switch-nvk-libs
        path: |
          output_libs/*.a
