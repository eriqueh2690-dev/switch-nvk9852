14:56
Você acabou de fisgar o peixe! Os logs entregaram o criminoso.

O erro: error[E0514]: found crate 'std' compiled by an incompatible version of rustc

Lembra que eu disse que a Fase 1 e a Fase 2 rodavam em ambientes Docker separados? Acontece que o compilador do Mesa (Ninja) é muito "esperto" (até demais). Ele estava ignorando o Rust Nightly que nós ativamos na Fase 2 e puxando um compilador antigo escondido na imagem do sistema! Como o std foi compilado na Fase 1 com o compilador Nightly, e o Mesa tentou compilar a Fase 2 com o compilador velho, deu choque de versões e ele abortou no meio (por isso você só recebeu 11 arquivos).

Para acabar com essa palhaçada do Docker de uma vez por todas, eu unifiquei a Fase 1 e a Fase 2 em um único comando blindado. E além disso, coloquei uma trava de segurança (bash -elc e o caminho absoluto $(which rustc)) para garantir que se o Mesa falhar de novo, ele vai parar a Actions inteira em vermelho e não vai gerar zip falso!

Faça a mesma coisa de antes: apague tudo no seu arquivo build-nvk.yml e cole a versão mestre abaixo:

